
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>しろまるの海辺アドベンチャー</title>
<style>
:root{
  --sky1:#8edcff;
  --sky2:#e9fbff;
  --sea:#48aee0;
  --sand:#efd49c;
  --ink:#22313a;
  --accent:#ff7fa8;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#7fd8ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  color:var(--ink);
  touch-action:none;
}
body{display:flex;justify-content:center}
#gameShell{
  position:relative;
  width:100%;
  max-width:520px;
  height:100%;
  overflow:hidden;
  background:linear-gradient(var(--sky1),var(--sky2));
}
canvas{display:block;width:100%;height:100%}
#hud{
  position:absolute;
  z-index:3;
  top:max(10px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  pointer-events:none;
}
.hudBox{
  background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.95);
  border-radius:15px;
  padding:8px 10px;
  box-shadow:0 5px 14px rgba(24,88,120,.16);
  font-weight:800;
  font-size:14px;
}
#stageBox{text-align:center}
#lifeBox{text-align:right}
#controls{
  position:absolute;
  z-index:4;
  left:0;
  right:0;
  bottom:max(18px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  align-items:end;
  padding:0 18px;
}
.moveGroup{display:flex;gap:10px}
.controlBtn{
  border:2px solid rgba(255,255,255,.92);
  background:rgba(255,255,255,.44);
  color:white;
  width:72px;
  height:72px;
  border-radius:50%;
  font-size:30px;
  font-weight:900;
  box-shadow:0 6px 16px rgba(35,87,110,.24);
  -webkit-tap-highlight-color:transparent;
}
#jumpBtn{
  width:92px;
  height:92px;
  background:rgba(255,127,168,.82);
  font-size:38px;
}
.controlBtn:active,.controlBtn.active{transform:scale(.94);filter:brightness(.96)}
#overlay{
  position:absolute;
  z-index:5;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:rgba(22,67,89,.20);
}
#overlay.hidden{display:none}
.panel{
  width:min(390px,100%);
  background:rgba(255,255,255,.96);
  border-radius:24px;
  padding:24px;
  text-align:center;
  box-shadow:0 18px 50px rgba(20,69,93,.30);
}
.logoSeal{
  width:112px;
  height:82px;
  margin:0 auto 8px;
  position:relative;
}
.logoSeal .body{
  position:absolute;inset:8px 8px 6px;
  border-radius:50%;
  background:#fffdf8;
  box-shadow:inset -8px -8px 0 #f2f0eb;
}
.logoSeal .eye{position:absolute;top:35px;width:6px;height:6px;background:#263238;border-radius:50%}
.logoSeal .eye.l{left:39px}.logoSeal .eye.r{right:39px}
.logoSeal .nose{position:absolute;top:46px;left:50%;width:8px;height:7px;background:#333;border-radius:50%;transform:translateX(-50%)}
.panel h1{font-size:23px;margin:6px 0}
.panel p{font-size:14px;line-height:1.7;margin:8px 0;color:#53636c}
.rules{margin:14px 0 4px;display:grid;gap:8px;text-align:left}
.rule{display:flex;align-items:center;gap:10px;background:#f2f8fc;border-radius:13px;padding:10px 12px;font-size:13px;font-weight:800;line-height:1.45}
.ruleIcon{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:20px;box-shadow:0 2px 8px rgba(30,82,108,.12)}
.primary{
  margin-top:14px;
  width:100%;
  border:0;
  border-radius:16px;
  padding:14px;
  background:#409bd3;
  color:#fff;
  font-size:17px;
  font-weight:900;
}
.small{font-size:12px;color:#76858d;margin-top:9px}
#toast{
  position:absolute;
  z-index:6;
  top:85px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(29,55,69,.82);
  color:#fff;
  padding:9px 14px;
  border-radius:999px;
  opacity:0;
  transition:.25s;
  white-space:nowrap;
  pointer-events:none;
  font-weight:800;
  font-size:13px;
}
#toast.show{opacity:1}
#homeBtn{
  position:absolute;
  z-index:4;
  top:max(64px,calc(env(safe-area-inset-top) + 54px));
  right:12px;
  border:0;
  border-radius:999px;
  padding:8px 12px;
  background:rgba(255,255,255,.86);
  color:#3b6172;
  font-weight:900;
  box-shadow:0 5px 14px rgba(24,88,120,.16);
}
#recordBox{
  margin:12px 0 2px;
  padding:12px;
  border-radius:16px;
  background:#eef9ff;
  font-weight:900;
  color:#2f6f91;
}
#recordBox div+div{margin-top:5px}
#storyOverlay{
  position:absolute;
  z-index:7;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(rgba(42,85,115,.22),rgba(18,54,75,.38));
}
#storyOverlay.show{display:flex}
#stageNotice{
  position:absolute;
  z-index:18;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  width:min(350px,84%);
  padding:18px 20px;
  border-radius:20px;
  background:rgba(28,47,92,.94);
  color:#fff;
  text-align:center;
  font-weight:900;
  line-height:1.65;
  box-shadow:0 14px 38px rgba(0,0,0,.28);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}
#stageNotice.show{opacity:1}
#stageNotice small{display:block;margin-top:5px;font-size:13px;font-weight:700;opacity:.88}
.storyCard{
  width:min(400px,100%);
  background:rgba(255,255,255,.97);
  border-radius:24px;
  padding:22px;
  text-align:center;
  box-shadow:0 18px 50px rgba(20,69,93,.32);
}
.storyScene{
  position:relative;
  height:210px;
  overflow:hidden;
  border-radius:18px;
  background:linear-gradient(#a7e4ff 0 58%,#56b5df 58% 74%,#efd49c 74%);
  margin-bottom:16px;
}
.storyMoon{
  position:absolute;right:26px;top:20px;width:42px;height:42px;border-radius:50%;
  background:#fff4b8;box-shadow:0 0 18px rgba(255,244,184,.75)
}
.storySeal,.storyDad{
  position:absolute;
  bottom:32px;
  width:82px;height:58px;border-radius:50%;
  background:#fffdf8;
  box-shadow:inset -8px -7px 0 #efede7;
}
.storySeal{left:32px}
.storyDad{right:30px;transform:scale(1.12)}
.storyEye{
  position:absolute;top:22px;width:5px;height:5px;background:#263238;border-radius:50%
}
.storySeal .storyEye.l,.storyDad .storyEye.l{left:26px}
.storySeal .storyEye.r,.storyDad .storyEye.r{right:26px}
.storyNose{
  position:absolute;top:31px;left:50%;width:7px;height:6px;background:#333;border-radius:50%;
  transform:translateX(-50%)
}
.storyTrail{
  position:absolute;left:112px;right:112px;bottom:44px;height:4px;
  border-top:4px dotted rgba(255,255,255,.85)
}
.storyCard h2{margin:4px 0 10px;font-size:22px}
.storyCard p{margin:0;line-height:1.8;font-size:15px;color:#4e626c}
#storyNextBtn{
  margin-top:16px;width:100%;border:0;border-radius:16px;padding:14px;
  background:#ff8eae;color:#fff;font-size:17px;font-weight:900
}
.storyHiddenDad .storyDad{opacity:.22}
.storyHiddenDad .storyTrail{right:58px}
.storyReunion .storySeal{left:93px}
.storyReunion .storyDad{right:93px}
.storyHeart{
  position:absolute;left:50%;top:57px;transform:translateX(-50%);
  font-size:42px;display:none
}
.storyReunion .storyHeart{display:block}
</style>
</head>
<body>
<div id="gameShell">
  <canvas id="game"></canvas>

  <button id="homeBtn" aria-label="トップへ戻る">トップへ</button>

  <div id="hud">
    <div class="hudBox">🐚 <span id="score">0</span></div>
    <div id="stageBox" class="hudBox">STAGE 1</div>
    <div id="lifeBox" class="hudBox">❤️❤️❤️</div>
  </div>

  <div id="toast">ステージクリア！</div>

  <div id="controls">
    <div class="moveGroup">
      <button id="leftBtn" class="controlBtn" aria-label="左へ">◀</button>
      <button id="rightBtn" class="controlBtn" aria-label="右へ">▶</button>
    </div>
    <button id="jumpBtn" class="controlBtn" aria-label="ジャンプ">⬆</button>
  </div>

  <div id="storyOverlay">
    <div class="storyCard">
      <div id="storyScene" class="storyScene storyHiddenDad">
        <div class="storyMoon"></div>
        <div class="storyTrail"></div>
        <div class="storySeal"><span class="storyEye l"></span><span class="storyEye r"></span><span class="storyNose"></span></div>
        <div class="storyDad"><span class="storyEye l"></span><span class="storyEye r"></span><span class="storyNose"></span></div>
        <div class="storyHeart">💖</div>
      </div>
      <h2 id="storyTitle">お父さんを探して</h2>
      <p id="storyText"></p>
      <button id="storyNextBtn">つぎのステージへ</button>
    </div>
  </div>

  <div id="overlay">
    <div class="panel">
      <div class="logoSeal" aria-hidden="true">
        <div class="body"></div>
        <div class="eye l"></div>
        <div class="eye r"></div>
        <div class="nose"></div>
      </div>
      <h1 id="overlayTitle">しろまるの海辺アドベンチャー</h1>
      <p id="overlayText">貝がらを集めながら、海辺のゴールを目指そう！</p>
      <div id="introRules" class="rules">
        <div class="rule"><span class="ruleIcon">⬆️</span><span>ジャンプボタンを空中でもう一度押すと、二段ジャンプ！</span></div>
        <div class="rule"><span class="ruleIcon">👾</span><span>カニなどの敵は、上から踏みつけるとダメージなしで倒せます。</span></div>
        <div class="rule"><span class="ruleIcon">🪨</span><span>敵の横や岩にぶつかると、ライフが1つ減ります。岩は倒せません。</span></div>
        <div class="rule"><span class="ruleIcon">🌟</span><span>ステージ4だけ自動横スクロール。左右ボタンで位置を調整できます。</span></div>
      </div>
      <div id="recordBox">
        <div>今回の記録：🐚 <span id="lastScore">0</span></div>
        <div>最高記録：🏆 <span id="bestScore">0</span></div>
      </div>
      <button id="startBtn" class="primary">ゲームスタート</button>
      <div class="small">スマホ縦画面対応｜左右移動＋ジャンプ</div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const stageEl = document.getElementById('stageBox');
  const lifeEl = document.getElementById('lifeBox');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const introRules = document.getElementById('introRules');
  const startBtn = document.getElementById('startBtn');
  const toast = document.getElementById('toast');
  const homeBtn = document.getElementById('homeBtn');
  const lastScoreEl = document.getElementById('lastScore');
  const bestScoreEl = document.getElementById('bestScore');
  const storyOverlay = document.getElementById('storyOverlay');
  const storyScene = document.getElementById('storyScene');
  const storyTitle = document.getElementById('storyTitle');
  const storyText = document.getElementById('storyText');
  const storyNextBtn = document.getElementById('storyNextBtn');
  const autoBadge = document.getElementById('autoBadge');
  const stageNotice = document.getElementById('stageNotice');

  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');
  const jumpBtn = document.getElementById('jumpBtn');
  const controlButtons = [leftBtn,rightBtn,jumpBtn];

  const activeControlPointers={left:null,right:null};
  let keyboardLeft=false;
  let keyboardRight=false;
  let inputResetUntil=0;

  let W=390,H=760,dpr=1;
  function resize(){
    const r=canvas.getBoundingClientRect();
    dpr=Math.min(devicePixelRatio||1,2);
    W=r.width; H=r.height;
    canvas.width=Math.round(W*dpr);
    canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize);
  resize();

  const keys={left:false,right:false,jump:false};
  const player={x:90,y:0,w:64,h:48,vx:0,vy:0,jumps:0,inv:0};
  let running=false,dead=false;
  let score=0,lives=3,stage=1,worldX=0;
  let lastScore=Number(localStorage.getItem('shiromaruLastScore')||0);
  let bestScore=Number(localStorage.getItem('shiromaruBestScore')||0);
  let platforms=[],items=[],enemies=[],particles=[];
  let finishX=1800;
  let last=0;
  let stageClearLocked=false;

  const stages=[
    {name:'砂浜', sky1:'#8edcff',sky2:'#e9fbff',sea:'#48aee0',sand:'#efd49c',finish:1800},
    {name:'夕焼け', sky1:'#ffb782',sky2:'#ffe7c7',sea:'#4b8bc4',sand:'#e9c27f',finish:2100},
    {name:'氷の海', sky1:'#a8d9ff',sky2:'#f7fdff',sea:'#72b5da',sand:'#dcecf2',finish:2350},
    {name:'星空の浜辺', sky1:'#4059a8',sky2:'#9bc5ff',sea:'#315f93',sand:'#d7c694',finish:2550,autoScroll:true},
    {name:'虹の海', sky1:'#ffb8d2',sky2:'#c9f4ff',sea:'#57b8ce',sand:'#f1d8a5',finish:2800}
  ];
  const stories=[
    {
      title:'のこされた足あと',
      text:'砂浜に、大きなアザラシの足あとが残っていました。姿は見えなくても、そこにいたことは分かります。しろまるは、その足あとを信じて歩き出しました。'
    },
    {
      title:'遠くても届く声',
      text:'夕焼けの海の向こうから、「しろまるー！」とやさしい声が聞こえました。会えない時間が長くても、覚えている声は、ちゃんと心まで届きます。'
    },
    {
      title:'ぬくもりの記憶',
      text:'氷のそばに、お父さんの青いマフラーが落ちていました。しろまるはそっと抱きしめます。冷たい風の中でも、思い出したぬくもりは消えませんでした。'
    },
    {
      title:'帰る場所へ続く光',
      text:'夜空の星が、海の向こうへ一本の道を照らしました。離れていた時間も、迷った道も、きっとこの場所へ続いていたのです。'
    },
    {
      title:'会いたかった人',
      text:'虹の浜辺で、しろまるはついにお父さんを見つけました。ふたりは何も言わず、ぎゅっと抱き合います。会えなかった時間まで、抱きしめるように。'
    }
  ];


  function validateStageModes(){
    const autoStages=stages
      .map((s,i)=>s.autoScroll===true?i+1:null)
      .filter(Boolean);
    if(autoStages.length!==1 || autoStages[0]!==4){
      stages.forEach((s,i)=>s.autoScroll=(i===3));
      console.error('自動スクロール設定をステージ4のみに修正しました');
    }
  }

  function groundY(){return H-150}

  function clearControls(){
    keys.left=false;
    keys.right=false;
    keyboardLeft=false;
    keyboardRight=false;
    activeControlPointers.left=null;
    activeControlPointers.right=null;
    player.vx=0;
    inputResetUntil=performance.now()+300;
    controlButtons.forEach(btn=>btn.classList.remove('active'));
  }

  function showStageNotice(){
    if(!(stage===4 && stages[stage-1].autoScroll===true))return;
    stageNotice.classList.add('show');
    setTimeout(()=>stageNotice.classList.remove('show'),2200);
  }

  function resetStage(full=false){
    stageClearLocked=false;
    clearControls();
    if(full){score=0;lives=3;stage=1}
    worldX=0;
    player.x=90;player.y=groundY()-player.h;player.vx=0;player.vy=0;player.jumps=0;player.inv=0;
    const s=stages[stage-1];
    finishX=s.finish;
    platforms=[
      {x:0,y:groundY(),w:finishX+500,h:200},
      {x:420,y:groundY()-88,w:150,h:20},
      {x:850,y:groundY()-118,w:160,h:20},
      {x:1300,y:groundY()-80,w:140,h:20}
    ];
    items=[];
    for(let x=220;x<finishX-160;x+=170){
      items.push({x:x,y:groundY()-62-(Math.random()<.35?80:0),got:false,bob:Math.random()*6.28});
    }
    enemies=[];
    for(let x=520;x<finishX-220;x+=330){
      const roll=Math.random();
      const type=roll<.26?'crab':roll<.48?'gull':roll<.68?'jelly':roll<.86?'star':'rock';
      enemies.push({
        type,
        x:x,
        y:0,
        w:type==='gull'?52:type==='jelly'?46:type==='star'?44:48,
        h:type==='gull'?34:type==='jelly'?44:type==='star'?40:36,
        dir:Math.random()<.5?-1:1,
        dead:false,
        phase:Math.random()*Math.PI*2
      });
    }
    particles=[];
    autoBadge.style.display=(stage===4 && s.autoScroll===true)?'block':'none';
    updateHud();
  }

  function updateHud(){
    scoreEl.textContent=score;
    stageEl.textContent=`STAGE ${stage}・${stages[stage-1].name}`;
    lifeEl.textContent='❤️'.repeat(Math.max(0,lives));
  }

  function updateRecords(){
    lastScoreEl.textContent=lastScore;
    bestScoreEl.textContent=bestScore;
  }

  function saveScore(){
    lastScore=score;
    if(score>bestScore)bestScore=score;
    localStorage.setItem('shiromaruLastScore',String(lastScore));
    localStorage.setItem('shiromaruBestScore',String(bestScore));
    updateRecords();
  }

  function showTop(message='貝がらを集めながら、敵や岩をよけてゴールを目指そう。'){
    closeStory();
    if(running)saveScore();
    running=false;
    clearControls();
    overlayTitle.textContent='しろまるの海辺アドベンチャー';
    overlayText.textContent=message;
    startBtn.textContent='ゲームスタート';
    overlay.classList.remove('hidden');
    resetStage(true);
    draw();
  }

  function startGame(){
    closeStory();
    stageClearLocked=false;
    if(dead){
      dead=false;
      resetStage(true);
      overlayTitle.textContent='しろまるの海辺アドベンチャー';
      overlayText.textContent='貝がらを集めながら、海辺のゴールを目指そう！';
      startBtn.textContent='ゲームスタート';
      introRules.style.display='grid';
    }
    running=true;
    overlay.classList.add('hidden');
    last=performance.now();
    showStageNotice();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running=false;dead=true;
    saveScore();
    overlayTitle.textContent='ゲームオーバー';
    introRules.style.display='none';
    overlayText.textContent=`貝がらを ${score} 個集めました。もう一度挑戦しよう！`;
    startBtn.textContent='もう一度あそぶ';
    overlay.classList.remove('hidden');
  }


  function showStory(clearedStage){
    const story=stories[clearedStage-1];
    if(!story)return;

    storyTitle.textContent=story.title;
    storyText.textContent=story.text;
    storyScene.className='storyScene '+(clearedStage===5?'storyReunion':'storyHiddenDad');
    storyNextBtn.textContent=clearedStage===5?'トップページへ':'つぎのステージへ';

    // クラスだけでなく表示状態も直接指定し、端末差による非表示を防止
    storyOverlay.classList.add('show');
    storyOverlay.style.display='flex';
    storyOverlay.style.zIndex='20';
  }

  function closeStory(){
    storyOverlay.classList.remove('show');
    storyOverlay.style.display='none';
  }

  function clearStage(){
    if(stageClearLocked)return;
    stageClearLocked=true;
    running=false;
    clearControls();

    const clearedStage=stage;
    toast.textContent='ステージクリア！';
    toast.classList.add('show');

    // 紙芝居を先に確実に表示し、トーストだけ少し遅れて消す
    showStory(clearedStage);
    setTimeout(()=>toast.classList.remove('show'),650);
  }

  function jump(){
    if(!running)return;
    if(player.jumps<2){
      player.vy=player.jumps===0?-16.2:-13.8;
      player.jumps++;
      burst(player.x+player.w*.35,player.y+player.h,'#ffffff');
    }
  }

  // スマホでは touchstart と pointerdown が二重発火するため、
  // 操作イベントを Pointer Events に一本化。
  function bindHold(btn,key){
    btn.addEventListener('pointerdown',e=>{
      e.preventDefault();
      if(performance.now()<inputResetUntil)return;
      activeControlPointers[key]=e.pointerId;
      keys[key]=true;
      btn.classList.add('active');
      if(btn.setPointerCapture){
        try{btn.setPointerCapture(e.pointerId)}catch(_){}
      }
    },{passive:false});

    const release=e=>{
      e.preventDefault();
      if(activeControlPointers[key]===e.pointerId || e.type==='lostpointercapture'){
        activeControlPointers[key]=null;
        keys[key]=false;
        btn.classList.remove('active');
      }
    };
    ['pointerup','pointercancel','lostpointercapture'].forEach(type=>{
      btn.addEventListener(type,release,{passive:false});
    });
  }

  bindHold(leftBtn,'left');
  bindHold(rightBtn,'right');

  ['pointerup','pointercancel','blur','pagehide'].forEach(type=>{
    window.addEventListener(type,()=>{
      activeControlPointers.left=null;
      activeControlPointers.right=null;
      keys.left=false;
      keys.right=false;
      leftBtn.classList.remove('active');
      rightBtn.classList.remove('active');
    });
  });

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      activeControlPointers.left=null;
      activeControlPointers.right=null;
      keys.left=false;
      keys.right=false;
      leftBtn.classList.remove('active');
      rightBtn.classList.remove('active');
    }
  });

  jumpBtn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(performance.now()<inputResetUntil)return;
    jumpBtn.classList.add('active');
    jump();
    setTimeout(()=>jumpBtn.classList.remove('active'),90);
  },{passive:false});

  addEventListener('keydown',e=>{
    if(e.code==='ArrowLeft'){keyboardLeft=true;keys.left=true}
    if(e.code==='ArrowRight'){keyboardRight=true;keys.right=true}
    if((e.code==='Space'||e.code==='ArrowUp')&&!e.repeat){
      e.preventDefault();
      jump();
    }
  });

  addEventListener('keyup',e=>{
    if(e.code==='ArrowLeft'){
      keyboardLeft=false;
      if(activeControlPointers.left===null)keys.left=false;
    }
    if(e.code==='ArrowRight'){
      keyboardRight=false;
      if(activeControlPointers.right===null)keys.right=false;
    }
  });

  if(!startBtn||!leftBtn||!rightBtn||!jumpBtn){
    throw new Error('操作ボタンの読み込みに失敗しました');
  }
  startBtn.addEventListener('click',startGame);
  homeBtn.addEventListener('click',()=>{
    closeStory();
    showTop('トップページに戻りました。もう一度、最初から挑戦できます。');
  });

  storyNextBtn.addEventListener('click',()=>{
    const clearedStage=stage;
    closeStory();
    if(clearedStage<stages.length){
      stage++;
      resetStage(false);
      stageClearLocked=false;
      running=true;
      last=performance.now();
      showStageNotice();
      requestAnimationFrame(loop);
    }else{
      saveScore();
      dead=true;
      showTop('しろまるは、お父さんと再会できました。離れていた時間も、ふたりを結ぶ大切な物語になりました。');
    }
  });

  function rectHit(a,b){
    return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  }

  function burst(x,y,color){
    for(let i=0;i<8;i++){
      particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*4,life:25,color});
    }
  }

  function hurt(){
    if(player.inv>0)return;
    lives--;
    player.inv=90;
    player.vy=-8;
    player.x=Math.max(40,player.x-40);
    burst(player.x+30,player.y+20,'#ff8ca8');
    updateHud();
    if(lives<=0)endGame();
  }

  function update(dt){
    const s=dt/16.67;
    const accel=0.55*s;
    const previousY=player.y;

    if(performance.now()<inputResetUntil){
      keys.left=false;
      keys.right=false;
      player.vx=0;
    }else{
      keys.left=keyboardLeft||activeControlPointers.left!==null;
      keys.right=keyboardRight||activeControlPointers.right!==null;
    }

    if(keys.left)player.vx-=accel;
    if(keys.right)player.vx+=accel;
    player.vx*=Math.pow(.84,s);
    player.vx=Math.max(-5.2,Math.min(5.2,player.vx));
    player.vy+=.72*s;
    player.x+=player.vx*s;
    player.y+=player.vy*s;
    if(player.inv>0)player.inv-=s;

    player.x=Math.max(20,player.x);

    let grounded=false;
    for(const p of platforms){
      const px=p.x-worldX;
      const prevBottom=player.y+player.h-player.vy*s;
      if(player.x+player.w>px&&player.x<px+p.w&&
         player.y+player.h>=p.y&&prevBottom<=p.y+5&&player.vy>=0){
        player.y=p.y-player.h;
        player.vy=0;
        player.jumps=0;
        grounded=true;
      }
    }
    if(player.y>H+120){hurt();player.y=groundY()-player.h;player.vy=0}

    const currentStage=stages[stage-1];
    const isAutoStage=(stage===4 && currentStage.autoScroll===true);
    if(isAutoStage){
      // ステージ4限定。背景は自動で進むが、左右操作は有効。
      worldX+=1.45*s;
      player.x=Math.max(18,Math.min(W*.78,player.x));
    }else if(player.x>W*.56){
      const shift=player.x-W*.56;
      player.x-=shift;
      worldX+=shift;
    }

    for(const it of items){
      if(it.got)continue;
      it.bob+=.07*s;
      const r={x:it.x-worldX,y:it.y+Math.sin(it.bob)*5,w:26,h:24};
      if(rectHit(player,r)){
        it.got=true;score++;updateHud();burst(r.x+13,r.y+12,'#ffd36a');
      }
    }

    for(const e of enemies){
      if(e.dead)continue;

      if(e.type==='crab'){
        e.x+=e.dir*.65*s;
        e.y=groundY()-e.h;
      }else if(e.type==='gull'){
        e.x+=e.dir*.9*s;
        e.phase+=.045*s;
        e.y=groundY()-105+Math.sin(e.phase)*24;
      }else if(e.type==='jelly'){
        e.x+=e.dir*.45*s;
        e.phase+=.04*s;
        e.y=groundY()-125+Math.sin(e.phase)*28;
      }else if(e.type==='star'){
        e.x+=e.dir*.35*s;
        e.phase+=.05*s;
        e.y=groundY()-e.h+Math.sin(e.phase)*3;
      }else{
        e.y=groundY()-e.h;
      }

      const r={x:e.x-worldX+3,y:e.y+3,w:e.w-6,h:e.h-3};
      if(!rectHit(player,r))continue;

      const previousBottom=previousY+player.h;
      const currentBottom=player.y+player.h;
      const isDefeatable=e.type!=='rock';
      const crossedEnemyTop=previousBottom<=r.y+12 && currentBottom>=r.y;
      const stomped=isDefeatable && player.vy>0 && crossedEnemyTop;

      if(stomped){
        e.dead=true;
        player.y=r.y-player.h;
        player.vy=-10.8;
        player.jumps=1;
        burst(r.x+r.w/2,r.y+8,e.type==='gull'?'#ffffff':'#ffb06d');
        toast.textContent=
          e.type==='crab'?'カニを倒した！':
          e.type==='gull'?'カモメを倒した！':
          e.type==='jelly'?'クラゲを倒した！':
          e.type==='star'?'ヒトデを倒した！':'敵を踏みつけた！';
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'),500);
      }else{
        hurt();
      }
    }

    for(const p of particles){
      p.x+=p.vx*s;p.y+=p.vy*s;p.vy+=.22*s;p.life-=s;
    }
    particles=particles.filter(p=>p.life>0);

    if(worldX+player.x>finishX)clearStage();
  }

  function drawCloud(x,y,scale){
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.beginPath();
    ctx.arc(x,y,18*scale,0,Math.PI*2);
    ctx.arc(x+22*scale,y-7*scale,23*scale,0,Math.PI*2);
    ctx.arc(x+48*scale,y,17*scale,0,Math.PI*2);
    ctx.fill();
  }

  function drawBackground(){
    const s=stages[stage-1];
    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,s.sky1);grd.addColorStop(.58,s.sky2);
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

    drawCloud((90-worldX*.08)%700,90,1);
    drawCloud((360-worldX*.05)%700,160,.8);

    ctx.fillStyle=s.sea;
    ctx.globalAlpha=.65;
    ctx.beginPath();
    ctx.moveTo(0,groundY()-125);
    for(let x=0;x<=W;x+=18)ctx.lineTo(x,groundY()-125+Math.sin((x+worldX*.5)/35)*7);
    ctx.lineTo(W,groundY()+10);ctx.lineTo(0,groundY()+10);ctx.fill();
    ctx.globalAlpha=1;

    ctx.fillStyle=s.sand;
    ctx.fillRect(0,groundY(),W,H-groundY());
  }

  function drawPlatform(p){
    const x=p.x-worldX;
    if(x>W+50||x+p.w<-50)return;
    ctx.fillStyle=stages[stage-1].sand;
    ctx.fillRect(x,p.y,p.w,p.h);
    if(p.y<groundY()){
      ctx.fillStyle='rgba(255,255,255,.45)';
      ctx.fillRect(x,p.y,p.w,5);
    }
  }

  function drawSeal(){
    if(player.inv>0&&Math.floor(player.inv/6)%2===0)return;
    const x=player.x,y=player.y;
    ctx.save();
    ctx.translate(x+player.w/2,y+player.h/2);
    ctx.rotate(Math.max(-.16,Math.min(.16,player.vy/55)));
    ctx.translate(-player.w/2,-player.h/2);

    ctx.fillStyle='rgba(0,0,0,.12)';
    ctx.beginPath();ctx.ellipse(31,48,29,5,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#fffdf8';
    ctx.beginPath();ctx.ellipse(31,26,31,22,-.04,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(54,31,15,10,.25,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#f1eee8';
    ctx.beginPath();ctx.ellipse(21,39,13,6,-.35,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#253039';
    ctx.beginPath();ctx.arc(21,21,2.7,0,Math.PI*2);ctx.arc(39,21,2.7,0,Math.PI*2);ctx.arc(30,29,3.3,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle='#8c949a';ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(26,31);ctx.lineTo(13,29);
    ctx.moveTo(26,34);ctx.lineTo(12,37);
    ctx.moveTo(34,31);ctx.lineTo(47,29);
    ctx.moveTo(34,34);ctx.lineTo(48,37);
    ctx.stroke();

    ctx.fillStyle='rgba(245,165,170,.55)';
    ctx.beginPath();ctx.arc(15,29,4,0,Math.PI*2);ctx.arc(45,29,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function drawShell(it){
    const x=it.x-worldX,y=it.y+Math.sin(it.bob)*5;
    if(x<-30||x>W+30||it.got)return;
    ctx.save();ctx.translate(x+13,y+12);
    ctx.fillStyle='#f5a9b6';
    ctx.beginPath();ctx.moveTo(-12,10);ctx.quadraticCurveTo(-12,-9,0,-12);ctx.quadraticCurveTo(12,-9,12,10);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.75)';
    for(let i=-8;i<=8;i+=4){ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(i,9);ctx.stroke()}
    ctx.restore();
  }

  function drawEnemy(e){
    if(e.dead)return;
    const x=e.x-worldX,y=e.y;
    if(x<-80||x>W+80)return;

    if(e.type==='rock'){
      ctx.fillStyle='#727984';
      ctx.beginPath();
      ctx.moveTo(x,y+e.h);ctx.lineTo(x+6,y+12);ctx.lineTo(x+22,y);
      ctx.lineTo(x+e.w-4,y+14);ctx.lineTo(x+e.w,y+e.h);
      ctx.closePath();ctx.fill();
      return;
    }

    if(e.type==='gull'){
      ctx.save();
      ctx.translate(x,y);
      if(e.dir<0){ctx.translate(e.w,0);ctx.scale(-1,1)}
      ctx.fillStyle='#fffdf8';
      ctx.beginPath();ctx.ellipse(27,18,18,10,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.moveTo(18,18);ctx.quadraticCurveTo(2,4,5,22);ctx.quadraticCurveTo(12,25,22,20);ctx.fill();
      ctx.fillStyle='#f4bf43';
      ctx.beginPath();ctx.moveTo(43,16);ctx.lineTo(53,20);ctx.lineTo(43,23);ctx.closePath();ctx.fill();
      ctx.fillStyle='#263238';
      ctx.beginPath();ctx.arc(37,15,2,0,Math.PI*2);ctx.fill();
      ctx.restore();
      return;
    }

    if(e.type==='jelly'){
      ctx.save();ctx.translate(x,y);
      ctx.fillStyle='#bca7ff';
      ctx.beginPath();ctx.arc(23,17,18,Math.PI,0);ctx.lineTo(41,27);ctx.lineTo(5,27);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#9b86e8';ctx.lineWidth=3;
      for(let i=10;i<=36;i+=9){ctx.beginPath();ctx.moveTo(i,26);ctx.quadraticCurveTo(i-4,34,i,42);ctx.stroke()}
      ctx.fillStyle='#2f3340';ctx.beginPath();ctx.arc(17,18,2,0,7);ctx.arc(29,18,2,0,7);ctx.fill();
      ctx.restore();
      return;
    }

    if(e.type==='star'){
      ctx.save();ctx.translate(x+22,y+20);
      ctx.fillStyle='#ffcf65';
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const a=-Math.PI/2+i*Math.PI/5;
        const r=i%2===0?20:8;
        const px=Math.cos(a)*r,py=Math.sin(a)*r;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#30343c';ctx.beginPath();ctx.arc(-5,-2,2,0,7);ctx.arc(5,-2,2,0,7);ctx.fill();
      ctx.restore();
      return;
    }

    ctx.save();ctx.translate(x,y);
    ctx.fillStyle='#e97b63';ctx.strokeStyle='#d86855';ctx.lineWidth=4;
    ctx.beginPath();ctx.ellipse(24,20,17,12,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(10,22);ctx.lineTo(2,31);
    ctx.moveTo(17,27);ctx.lineTo(11,35);
    ctx.moveTo(31,27);ctx.lineTo(37,35);
    ctx.moveTo(38,22);ctx.lineTo(46,31);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(18,13,4,0,Math.PI*2);ctx.arc(30,13,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(19,13,1.7,0,Math.PI*2);ctx.arc(29,13,1.7,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function drawFinish(){
    const x=finishX-worldX;
    if(x<-60||x>W+60)return;
    ctx.fillStyle='#8b6b4d';ctx.fillRect(x,groundY()-115,8,115);
    ctx.fillStyle='#ff7fa8';ctx.beginPath();ctx.moveTo(x+8,groundY()-110);ctx.lineTo(x+62,groundY()-92);ctx.lineTo(x+8,groundY()-73);ctx.closePath();ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawBackground();
    platforms.forEach(drawPlatform);
    items.forEach(drawShell);
    enemies.forEach(drawEnemy);
    drawFinish();
    particles.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.life/25);
      ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    });
    drawSeal();
  }

  function loop(t){
    if(!running)return;
    const dt=Math.min(32,t-last||16.67);last=t;
    update(dt);
    draw();
    if(running)requestAnimationFrame(loop);
  }

  validateStageModes();
  resetStage(true);
  updateRecords();
  draw();
})();
</script>
</body>
</html>
