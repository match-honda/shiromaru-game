
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>しろまるの海辺アドベンチャー</title>
<style>
:root{
  --sky1:#8edcff;
  --sky2:#e9fbff;
  --sea:#48aee0;
  --sand:#efd49c;
  --ink:#22313a;
  --accent:#ff7fa8;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#7fd8ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  color:var(--ink);
  touch-action:none;
}
body{display:flex;justify-content:center}
#gameShell{
  position:relative;
  width:100%;
  max-width:520px;
  height:100%;
  overflow:hidden;
  background:linear-gradient(var(--sky1),var(--sky2));
}
canvas{display:block;width:100%;height:100%}
#hud{
  position:absolute;
  z-index:3;
  top:max(10px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  pointer-events:none;
}
.hudBox{
  background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.95);
  border-radius:15px;
  padding:8px 10px;
  box-shadow:0 5px 14px rgba(24,88,120,.16);
  font-weight:800;
  font-size:14px;
}
#stageBox{text-align:center}
#lifeBox{text-align:right}
#controls{
  position:absolute;
  z-index:4;
  left:0;
  right:0;
  bottom:max(18px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  align-items:end;
  padding:0 18px;
}
.moveGroup{display:flex;gap:10px}
.controlBtn{
  border:2px solid rgba(255,255,255,.92);
  background:rgba(255,255,255,.44);
  color:white;
  width:72px;
  height:72px;
  border-radius:50%;
  font-size:30px;
  font-weight:900;
  box-shadow:0 6px 16px rgba(35,87,110,.24);
  -webkit-tap-highlight-color:transparent;
}
#jumpBtn{
  width:92px;
  height:92px;
  background:rgba(255,127,168,.82);
  font-size:38px;
}
.controlBtn:active,.controlBtn.active{transform:scale(.94);filter:brightness(.96)}
#overlay{
  position:absolute;
  z-index:5;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:rgba(22,67,89,.20);
}
#overlay.hidden{display:none}
.panel{
  width:min(390px,100%);
  background:rgba(255,255,255,.96);
  border-radius:24px;
  padding:24px;
  text-align:center;
  box-shadow:0 18px 50px rgba(20,69,93,.30);
}
.logoSeal{
  width:112px;
  height:82px;
  margin:0 auto 8px;
  position:relative;
}
.logoSeal .body{
  position:absolute;inset:8px 8px 6px;
  border-radius:50%;
  background:#fffdf8;
  box-shadow:inset -8px -8px 0 #f2f0eb;
}
.logoSeal .eye{position:absolute;top:35px;width:6px;height:6px;background:#263238;border-radius:50%}
.logoSeal .eye.l{left:39px}.logoSeal .eye.r{right:39px}
.logoSeal .nose{position:absolute;top:46px;left:50%;width:8px;height:7px;background:#333;border-radius:50%;transform:translateX(-50%)}
.panel h1{font-size:23px;margin:6px 0}
.panel p{font-size:14px;line-height:1.7;margin:8px 0;color:#53636c}
.rules{margin:14px 0 4px;display:grid;gap:8px;text-align:left}
.rule{display:flex;align-items:center;gap:10px;background:#f2f8fc;border-radius:13px;padding:10px 12px;font-size:13px;font-weight:800;line-height:1.45}
.ruleIcon{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:20px;box-shadow:0 2px 8px rgba(30,82,108,.12)}
.primary{
  margin-top:14px;
  width:100%;
  border:0;
  border-radius:16px;
  padding:14px;
  background:#409bd3;
  color:#fff;
  font-size:17px;
  font-weight:900;
}
.small{font-size:12px;color:#76858d;margin-top:9px}
#toast{
  position:absolute;
  z-index:6;
  top:85px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(29,55,69,.82);
  color:#fff;
  padding:9px 14px;
  border-radius:999px;
  opacity:0;
  transition:.25s;
  white-space:nowrap;
  pointer-events:none;
  font-weight:800;
  font-size:13px;
}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="gameShell">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hudBox">🐚 <span id="score">0</span></div>
    <div id="stageBox" class="hudBox">STAGE 1</div>
    <div id="lifeBox" class="hudBox">❤️❤️❤️</div>
  </div>

  <div id="toast">ステージクリア！</div>

  <div id="controls">
    <div class="moveGroup">
      <button id="leftBtn" class="controlBtn" aria-label="左へ">◀</button>
      <button id="rightBtn" class="controlBtn" aria-label="右へ">▶</button>
    </div>
    <button id="jumpBtn" class="controlBtn" aria-label="ジャンプ">⬆</button>
  </div>

  <div id="overlay">
    <div class="panel">
      <div class="logoSeal" aria-hidden="true">
        <div class="body"></div>
        <div class="eye l"></div>
        <div class="eye r"></div>
        <div class="nose"></div>
      </div>
      <h1 id="overlayTitle">しろまるの海辺アドベンチャー</h1>
      <p id="overlayText">貝がらを集めながら、海辺のゴールを目指そう！</p>
      <div id="introRules" class="rules">
        <div class="rule"><span class="ruleIcon">⬆️</span><span>ジャンプボタンを空中でもう一度押すと、二段ジャンプ！</span></div>
        <div class="rule"><span class="ruleIcon">🦀</span><span>カニは頭を上から踏むと、ダメージなしで倒せます。</span></div>
        <div class="rule"><span class="ruleIcon">💥</span><span>カニの横や岩にぶつかると、ライフが1つ減ります。</span></div>
      </div>
      <button id="startBtn" class="primary">ゲームスタート</button>
      <div class="small">スマホ縦画面対応｜左右移動＋ジャンプ</div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const stageEl = document.getElementById('stageBox');
  const lifeEl = document.getElementById('lifeBox');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const introRules = document.getElementById('introRules');
  const startBtn = document.getElementById('startBtn');
  const toast = document.getElementById('toast');

  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');
  const jumpBtn = document.getElementById('jumpBtn');

  let W=390,H=760,dpr=1;
  function resize(){
    const r=canvas.getBoundingClientRect();
    dpr=Math.min(devicePixelRatio||1,2);
    W=r.width; H=r.height;
    canvas.width=Math.round(W*dpr);
    canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize);
  resize();

  const keys={left:false,right:false,jump:false};
  const player={x:90,y:0,w:64,h:48,vx:0,vy:0,jumps:0,inv:0};
  let running=false,dead=false;
  let score=0,lives=3,stage=1,worldX=0;
  let platforms=[],items=[],enemies=[],particles=[];
  let finishX=1800;
  let last=0;

  const stages=[
    {name:'砂浜', sky1:'#8edcff',sky2:'#e9fbff',sea:'#48aee0',sand:'#efd49c',finish:1800},
    {name:'夕焼け', sky1:'#ffb782',sky2:'#ffe7c7',sea:'#4b8bc4',sand:'#e9c27f',finish:2100},
    {name:'氷の海', sky1:'#a8d9ff',sky2:'#f7fdff',sea:'#72b5da',sand:'#dcecf2',finish:2350}
  ];

  function groundY(){return H-150}

  function resetStage(full=false){
    if(full){score=0;lives=3;stage=1}
    worldX=0;
    player.x=90;player.y=groundY()-player.h;player.vx=0;player.vy=0;player.jumps=0;player.inv=0;
    const s=stages[stage-1];
    finishX=s.finish;
    platforms=[
      {x:0,y:groundY(),w:finishX+500,h:200},
      {x:420,y:groundY()-88,w:150,h:20},
      {x:850,y:groundY()-118,w:160,h:20},
      {x:1300,y:groundY()-80,w:140,h:20}
    ];
    items=[];
    for(let x=220;x<finishX-160;x+=170){
      items.push({x:x,y:groundY()-62-(Math.random()<.35?80:0),got:false,bob:Math.random()*6.28});
    }
    enemies=[];
    for(let x=520;x<finishX-220;x+=330){
      enemies.push({type:Math.random()<.55?'crab':'rock',x:x,y:0,w:48,h:36,dir:Math.random()<.5?-1:1,dead:false});
    }
    particles=[];
    updateHud();
  }

  function updateHud(){
    scoreEl.textContent=score;
    stageEl.textContent=`STAGE ${stage}・${stages[stage-1].name}`;
    lifeEl.textContent='❤️'.repeat(Math.max(0,lives));
  }

  function startGame(){
    if(dead){
      dead=false;
      resetStage(true);
      overlayTitle.textContent='しろまるの海辺アドベンチャー';
      overlayText.textContent='貝がらを集めながら、海辺のゴールを目指そう！';
      startBtn.textContent='ゲームスタート';
      introRules.style.display='grid';
    }
    running=true;
    overlay.classList.add('hidden');
    last=performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running=false;dead=true;
    overlayTitle.textContent='ゲームオーバー';
    introRules.style.display='none';
    overlayText.textContent=`貝がらを ${score} 個集めました。もう一度挑戦しよう！`;
    startBtn.textContent='もう一度あそぶ';
    overlay.classList.remove('hidden');
  }

  function clearStage(){
    running=false;
    toast.textContent='ステージクリア！';
    toast.classList.add('show');
    setTimeout(()=>{
      toast.classList.remove('show');
      if(stage<stages.length){
        stage++;
        resetStage(false);
        running=true;
        last=performance.now();
        requestAnimationFrame(loop);
      }else{
        overlayTitle.textContent='全ステージクリア！';
        introRules.style.display='none';
        overlayText.textContent=`おめでとう！ 貝がらを ${score} 個集めました。`;
        startBtn.textContent='最初からあそぶ';
        overlay.classList.remove('hidden');
        dead=true;
      }
    },900);
  }

  function jump(){
    if(!running)return;
    if(player.jumps<2){
      player.vy=player.jumps===0?-13.5:-11.5;
      player.jumps++;
      burst(player.x+player.w*.35,player.y+player.h,'#ffffff');
    }
  }

  function bindHold(btn,key){
    const on=e=>{e.preventDefault();keys[key]=true;btn.classList.add('active')};
    const off=e=>{e.preventDefault();keys[key]=false;btn.classList.remove('active')};
    ['pointerdown','touchstart'].forEach(t=>btn.addEventListener(t,on,{passive:false}));
    ['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(t=>btn.addEventListener(t,off,{passive:false}));
  }
  bindHold(leftBtn,'left');
  bindHold(rightBtn,'right');
  ['pointerdown','touchstart'].forEach(t=>jumpBtn.addEventListener(t,e=>{e.preventDefault();jumpBtn.classList.add('active');jump()},{passive:false}));
  ['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(t=>jumpBtn.addEventListener(t,e=>{e.preventDefault();jumpBtn.classList.remove('active')},{passive:false}));

  addEventListener('keydown',e=>{
    if(e.code==='ArrowLeft')keys.left=true;
    if(e.code==='ArrowRight')keys.right=true;
    if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}
  });
  addEventListener('keyup',e=>{
    if(e.code==='ArrowLeft')keys.left=false;
    if(e.code==='ArrowRight')keys.right=false;
  });
  startBtn.addEventListener('click',startGame);

  function rectHit(a,b){
    return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  }

  function burst(x,y,color){
    for(let i=0;i<8;i++){
      particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*4,life:25,color});
    }
  }

  function hurt(){
    if(player.inv>0)return;
    lives--;
    player.inv=90;
    player.vy=-8;
    player.x=Math.max(40,player.x-40);
    burst(player.x+30,player.y+20,'#ff8ca8');
    updateHud();
    if(lives<=0)endGame();
  }

  function update(dt){
    const s=dt/16.67;
    const accel=0.55*s;
    const previousY=player.y;
    if(keys.left)player.vx-=accel;
    if(keys.right)player.vx+=accel;
    player.vx*=Math.pow(.84,s);
    player.vx=Math.max(-5.2,Math.min(5.2,player.vx));
    player.vy+=.72*s;
    player.x+=player.vx*s;
    player.y+=player.vy*s;
    if(player.inv>0)player.inv-=s;

    player.x=Math.max(20,player.x);

    let grounded=false;
    for(const p of platforms){
      const px=p.x-worldX;
      const prevBottom=player.y+player.h-player.vy*s;
      if(player.x+player.w>px&&player.x<px+p.w&&
         player.y+player.h>=p.y&&prevBottom<=p.y+5&&player.vy>=0){
        player.y=p.y-player.h;
        player.vy=0;
        player.jumps=0;
        grounded=true;
      }
    }
    if(player.y>H+120){hurt();player.y=groundY()-player.h;player.vy=0}

    if(player.x>W*.56){
      const shift=player.x-W*.56;
      player.x-=shift;
      worldX+=shift;
    }

    for(const it of items){
      if(it.got)continue;
      it.bob+=.07*s;
      const r={x:it.x-worldX,y:it.y+Math.sin(it.bob)*5,w:26,h:24};
      if(rectHit(player,r)){
        it.got=true;score++;updateHud();burst(r.x+13,r.y+12,'#ffd36a');
      }
    }

    for(const e of enemies){
      if(e.dead)continue;
      if(e.type==='crab')e.x+=e.dir*.65*s;
      e.y=groundY()-e.h;
      const r={x:e.x-worldX+3,y:e.y+3,w:e.w-6,h:e.h-3};
      if(!rectHit(player,r))continue;

      const previousBottom=previousY+player.h;
      const currentBottom=player.y+player.h;
      const stomped=e.type==='crab' && player.vy>0 && previousBottom<=r.y+11 && currentBottom>=r.y;

      if(stomped){
        e.dead=true;
        player.y=r.y-player.h;
        player.vy=-9.5;
        player.jumps=1;
        burst(r.x+r.w/2,r.y+8,'#ffb06d');
        toast.textContent='カニを倒した！';
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'),500);
      }else{
        hurt();
      }
    }

    for(const p of particles){
      p.x+=p.vx*s;p.y+=p.vy*s;p.vy+=.22*s;p.life-=s;
    }
    particles=particles.filter(p=>p.life>0);

    if(worldX+player.x>finishX)clearStage();
  }

  function drawCloud(x,y,scale){
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.beginPath();
    ctx.arc(x,y,18*scale,0,Math.PI*2);
    ctx.arc(x+22*scale,y-7*scale,23*scale,0,Math.PI*2);
    ctx.arc(x+48*scale,y,17*scale,0,Math.PI*2);
    ctx.fill();
  }

  function drawBackground(){
    const s=stages[stage-1];
    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,s.sky1);grd.addColorStop(.58,s.sky2);
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

    drawCloud((90-worldX*.08)%700,90,1);
    drawCloud((360-worldX*.05)%700,160,.8);

    ctx.fillStyle=s.sea;
    ctx.globalAlpha=.65;
    ctx.beginPath();
    ctx.moveTo(0,groundY()-125);
    for(let x=0;x<=W;x+=18)ctx.lineTo(x,groundY()-125+Math.sin((x+worldX*.5)/35)*7);
    ctx.lineTo(W,groundY()+10);ctx.lineTo(0,groundY()+10);ctx.fill();
    ctx.globalAlpha=1;

    ctx.fillStyle=s.sand;
    ctx.fillRect(0,groundY(),W,H-groundY());
  }

  function drawPlatform(p){
    const x=p.x-worldX;
    if(x>W+50||x+p.w<-50)return;
    ctx.fillStyle=stages[stage-1].sand;
    ctx.fillRect(x,p.y,p.w,p.h);
    if(p.y<groundY()){
      ctx.fillStyle='rgba(255,255,255,.45)';
      ctx.fillRect(x,p.y,p.w,5);
    }
  }

  function drawSeal(){
    if(player.inv>0&&Math.floor(player.inv/6)%2===0)return;
    const x=player.x,y=player.y;
    ctx.save();
    ctx.translate(x+player.w/2,y+player.h/2);
    ctx.rotate(Math.max(-.16,Math.min(.16,player.vy/55)));
    ctx.translate(-player.w/2,-player.h/2);

    ctx.fillStyle='rgba(0,0,0,.12)';
    ctx.beginPath();ctx.ellipse(31,48,29,5,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#fffdf8';
    ctx.beginPath();ctx.ellipse(31,26,31,22,-.04,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(54,31,15,10,.25,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#f1eee8';
    ctx.beginPath();ctx.ellipse(21,39,13,6,-.35,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#253039';
    ctx.beginPath();ctx.arc(21,21,2.7,0,Math.PI*2);ctx.arc(39,21,2.7,0,Math.PI*2);ctx.arc(30,29,3.3,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle='#8c949a';ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(26,31);ctx.lineTo(13,29);
    ctx.moveTo(26,34);ctx.lineTo(12,37);
    ctx.moveTo(34,31);ctx.lineTo(47,29);
    ctx.moveTo(34,34);ctx.lineTo(48,37);
    ctx.stroke();

    ctx.fillStyle='rgba(245,165,170,.55)';
    ctx.beginPath();ctx.arc(15,29,4,0,Math.PI*2);ctx.arc(45,29,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function drawShell(it){
    const x=it.x-worldX,y=it.y+Math.sin(it.bob)*5;
    if(x<-30||x>W+30||it.got)return;
    ctx.save();ctx.translate(x+13,y+12);
    ctx.fillStyle='#f5a9b6';
    ctx.beginPath();ctx.moveTo(-12,10);ctx.quadraticCurveTo(-12,-9,0,-12);ctx.quadraticCurveTo(12,-9,12,10);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.75)';
    for(let i=-8;i<=8;i+=4){ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(i,9);ctx.stroke()}
    ctx.restore();
  }

  function drawEnemy(e){
    if(e.dead)return;
    const x=e.x-worldX,y=e.y;
    if(x<-80||x>W+80)return;
    if(e.type==='rock'){
      ctx.fillStyle='#727984';
      ctx.beginPath();ctx.moveTo(x,y+e.h);ctx.lineTo(x+6,y+12);ctx.lineTo(x+22,y);ctx.lineTo(x+e.w-4,y+14);ctx.lineTo(x+e.w,y+e.h);ctx.closePath();ctx.fill();
    }else{
      ctx.save();ctx.translate(x,y);
      ctx.fillStyle='#e97b63';ctx.strokeStyle='#d86855';ctx.lineWidth=4;
      ctx.beginPath();ctx.ellipse(24,20,17,12,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();
      ctx.moveTo(10,22);ctx.lineTo(2,31);
      ctx.moveTo(17,27);ctx.lineTo(11,35);
      ctx.moveTo(31,27);ctx.lineTo(37,35);
      ctx.moveTo(38,22);ctx.lineTo(46,31);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(18,13,4,0,Math.PI*2);ctx.arc(30,13,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#222';ctx.beginPath();ctx.arc(19,13,1.7,0,Math.PI*2);ctx.arc(29,13,1.7,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }

  function drawFinish(){
    const x=finishX-worldX;
    if(x<-60||x>W+60)return;
    ctx.fillStyle='#8b6b4d';ctx.fillRect(x,groundY()-115,8,115);
    ctx.fillStyle='#ff7fa8';ctx.beginPath();ctx.moveTo(x+8,groundY()-110);ctx.lineTo(x+62,groundY()-92);ctx.lineTo(x+8,groundY()-73);ctx.closePath();ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawBackground();
    platforms.forEach(drawPlatform);
    items.forEach(drawShell);
    enemies.forEach(drawEnemy);
    drawFinish();
    particles.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.life/25);
      ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    });
    drawSeal();
  }

  function loop(t){
    if(!running)return;
    const dt=Math.min(32,t-last||16.67);last=t;
    update(dt);
    draw();
    if(running)requestAnimationFrame(loop);
  }

  resetStage(true);
  draw();
})();
</script>
</body>
</html>
