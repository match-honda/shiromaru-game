<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>しろまるの海辺アドベンチャー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4fbff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24313a;display:flex;justify-content:center;padding:16px}.app{width:min(900px,100%)}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:10px}h1{margin:0;font-size:clamp(21px,4vw,30px)}p{margin:4px 0 0;color:#61727e}.scores{display:flex;gap:8px}.badge{background:#fff;border:1px solid #d2e2eb;border-radius:999px;padding:8px 12px}.wrap{position:relative;overflow:hidden;border-radius:20px;border:1px solid #cbdde8;box-shadow:0 12px 30px #54758922}canvas{display:block;width:100%;height:auto;touch-action:none;background:#dff4ff}.overlay{position:absolute;inset:0;background:#173b501f;display:flex;align-items:center;justify-content:center;padding:20px}.overlay.hidden{display:none}.panel{width:min(390px,100%);background:#fffffff2;border-radius:20px;padding:24px;text-align:center;box-shadow:0 12px 28px #284b6030}.icon{font-size:56px}.panel h2{margin:4px 0 8px}.panel p{font-size:14px;line-height:1.7}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{border:0;border-radius:14px;min-height:50px;font-size:16px;font-weight:700;cursor:pointer}.primary{width:100%;margin-top:18px;background:#3f91cf;color:#fff}.controls button{background:#fff;border:1px solid #cbdde8;color:#24313a}.help{text-align:center;font-size:13px;color:#6b7c87;margin-top:10px}@media(max-width:520px){body{padding:10px}.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<div class="top">
  <div><h1>しろまるの海辺アドベンチャー</h1><p>岩やカニを飛び越えて、貝がらを集めよう</p></div>
  <div class="scores"><div class="badge">貝がら <strong id="score">0</strong></div><div class="badge">最高 <strong id="best">0</strong></div></div>
</div>
<div class="wrap">
<canvas id="game" width="900" height="450"></canvas>
<div id="overlay" class="overlay">
  <div class="panel">
    <div class="icon">🦭</div>
    <h2 id="title">海辺へ出発！</h2>
    <p id="message">画面タップ、スペースキー、↑キー、またはジャンプボタンで操作します。二段ジャンプもできます。</p>
    <button id="start" class="primary">ゲームスタート</button>
  </div>
</div>
</div>
<div class="controls"><button id="jump">ジャンプ</button><button id="restart">やり直す</button></div>
<div class="help">Chromeでファイルを開くだけで遊べます</div>
</main>
<script>
(()=>{
const c=document.getElementById("game"),x=c.getContext("2d"),W=c.width,H=c.height,g=368;
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),overlay=document.getElementById("overlay"),title=document.getElementById("title"),message=document.getElementById("message"),start=document.getElementById("start");
let running=false,over=false,frame=0,speed=6,score=0,best=0,distance=0,obs=[],shells=[],clouds=[],parts=[],spawn=90,shellSpawn=55,raf;
const seal={x:130,y:g-60,w:90,h:60,vy:0,jumps:0};
function reset(){running=false;over=false;frame=0;speed=6;score=0;distance=0;obs=[];shells=[];parts=[];spawn=90;shellSpawn=55;clouds=[{x:100,y:70,s:1},{x:450,y:100,s:.8},{x:760,y:60,s:1.15}];seal.y=g-seal.h;seal.vy=0;seal.jumps=0;updateScore();draw()}
function updateScore(){scoreEl.textContent=score;bestEl.textContent=best}
function begin(){if(raf)cancelAnimationFrame(raf);if(over)reset();running=true;over=false;overlay.classList.add("hidden");raf=requestAnimationFrame(loop)}
function end(){running=false;over=true;best=Math.max(best,score);updateScore();title.textContent="おつかれさま！";message.textContent=`貝がらを ${score} 個集めました。もう一度挑戦しよう！`;start.textContent="もう一度あそぶ";overlay.classList.remove("hidden")}
function jump(){if(!running){begin();return}if(seal.jumps<2){seal.vy=seal.jumps===0?-16:-13.5;seal.jumps++;for(let i=0;i<7;i++)parts.push({x:seal.x+20,y:g-3,vx:-Math.random()*2.5-1,vy:-Math.random()*3.5,life:20})}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function addObs(){if(Math.random()<.45)obs.push({t:"crab",x:W+40,y:g-40,w:58,h:40});else{let s=42+Math.random()*24;obs.push({t:"rock",x:W+40,y:g-s,w:s,h:s})}}
function addShell(){let high=Math.random()<.55;shells.push({x:W+25,y:high?g-130-Math.random()*65:g-34,w:30,h:25,b:Math.random()*6.28})}
function update(){
 frame++;distance+=speed;speed=Math.min(12.5,6+distance/7600);
 seal.vy+=.95;seal.y+=seal.vy;if(seal.y>=g-seal.h){seal.y=g-seal.h;seal.vy=0;seal.jumps=0}
 if(--spawn<=0){addObs();spawn=Math.max(58,110-speed*4)+Math.random()*55}
 if(--shellSpawn<=0){addShell();shellSpawn=55+Math.random()*70}
 obs.forEach(o=>o.x-=speed);shells.forEach(s=>{s.x-=speed;s.b+=.08});clouds.forEach(a=>{a.x-=speed*.12;if(a.x<-120)a.x=W+90});parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life--});
 obs=obs.filter(o=>o.x+o.w>-20);shells=shells.filter(s=>s.x+s.w>-20);parts=parts.filter(p=>p.life>0);
 const hb={x:seal.x+14,y:seal.y+8,w:seal.w-28,h:seal.h-10};
 for(const o of obs){if(hit(hb,{x:o.x+5,y:o.y+4,w:o.w-10,h:o.h-5})){end();return}}
 for(let i=shells.length-1;i>=0;i--){const s=shells[i],sy=s.y+Math.sin(s.b)*4;if(hit(hb,{x:s.x,y:sy,w:s.w,h:s.h})){shells.splice(i,1);score++;updateScore()}}
}
function cloud(a){x.globalAlpha=.72;x.fillStyle="#fff";x.beginPath();x.arc(a.x,a.y,18*a.s,0,7);x.arc(a.x+22*a.s,a.y-7*a.s,22*a.s,0,7);x.arc(a.x+48*a.s,a.y,17*a.s,0,7);x.fill();x.globalAlpha=1}
function bg(){
 x.fillStyle="#dff4ff";x.fillRect(0,0,W,H);clouds.forEach(cloud);
 x.fillStyle="#69b7df";x.globalAlpha=.45;x.beginPath();x.moveTo(0,250);for(let i=0;i<=W;i+=24)x.lineTo(i,250+Math.sin((i+frame*2)/42)*7);x.lineTo(W,350);x.lineTo(0,350);x.fill();x.globalAlpha=1;
 x.fillStyle="#ead7a5";x.fillRect(0,g-18,W,H-g+18)
}
function sealDraw(){
 x.save();x.translate(seal.x+45,seal.y+30);x.rotate(Math.max(-.18,Math.min(.18,seal.vy/55)));x.translate(-45,-30);
 x.fillStyle="#00000020";x.beginPath();x.ellipse(43,59,34,6,0,0,7);x.fill();
 x.fillStyle="#fffdf7";x.beginPath();x.ellipse(43,31,42,27,-.05,0,7);x.fill();x.beginPath();x.ellipse(76,36,18,12,.25,0,7);x.fill();
 x.fillStyle="#f3efe7";x.beginPath();x.ellipse(31,47,16,7,-.35,0,7);x.fill();
 x.fillStyle="#25282c";x.beginPath();x.arc(31,26,3.2,0,7);x.arc(52,26,3.2,0,7);x.arc(41,34,4,0,7);x.fill();
 x.strokeStyle="#8c9399";x.lineWidth=1.5;x.beginPath();x.moveTo(36,36);x.lineTo(19,33);x.moveTo(36,39);x.lineTo(18,43);x.moveTo(46,36);x.lineTo(63,33);x.moveTo(46,39);x.lineTo(64,43);x.stroke();
 x.fillStyle="#f6b7b5";x.globalAlpha=.55;x.beginPath();x.arc(24,35,5,0,7);x.arc(58,35,5,0,7);x.fill();x.restore();x.globalAlpha=1
}
function rock(o){x.fillStyle="#727780";x.beginPath();x.moveTo(o.x+2,o.y+o.h);x.lineTo(o.x+8,o.y+13);x.lineTo(o.x+o.w*.42,o.y+2);x.lineTo(o.x+o.w-5,o.y+16);x.lineTo(o.x+o.w,o.y+o.h);x.fill()}
function crab(o){x.save();x.translate(o.x,o.y);x.strokeStyle="#d86855";x.fillStyle="#e97b63";x.lineWidth=4;x.beginPath();x.ellipse(29,24,20,14,0,0,7);x.fill();x.beginPath();x.moveTo(13,27);x.lineTo(3,36);x.moveTo(22,33);x.lineTo(15,40);x.moveTo(36,33);x.lineTo(43,40);x.moveTo(45,27);x.lineTo(55,36);x.stroke();x.fillStyle="#fff";x.beginPath();x.arc(22,15,4,0,7);x.arc(36,15,4,0,7);x.fill();x.fillStyle="#222";x.beginPath();x.arc(23,15,1.7,0,7);x.arc(35,15,1.7,0,7);x.fill();x.restore()}
function shell(s){let sy=s.y+Math.sin(s.b)*4;x.save();x.translate(s.x+15,sy+12);x.rotate(Math.sin(s.b)*.12);x.fillStyle="#f1a8aa";x.beginPath();x.moveTo(-14,10);x.quadraticCurveTo(-14,-10,0,-13);x.quadraticCurveTo(14,-10,14,10);x.fill();x.strokeStyle="#ffffffbb";for(let i=-8;i<=8;i+=4){x.beginPath();x.moveTo(0,-10);x.lineTo(i,9);x.stroke()}x.restore()}
function draw(){x.clearRect(0,0,W,H);bg();shells.forEach(shell);obs.forEach(o=>o.t==="crab"?crab(o):rock(o));parts.forEach(p=>{x.fillStyle="#ffffffdd";x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()});sealDraw()}
function loop(){if(!running)return;update();draw();if(running)raf=requestAnimationFrame(loop)}
start.addEventListener("click",begin);document.getElementById("jump").addEventListener("click",jump);document.getElementById("restart").addEventListener("click",()=>{if(raf)cancelAnimationFrame(raf);reset();title.textContent="海辺へ出発！";message.textContent="画面タップ、スペースキー、↑キー、またはジャンプボタンで操作します。二段ジャンプもできます。";start.textContent="ゲームスタート";overlay.classList.remove("hidden")});c.addEventListener("pointerdown",jump);document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}});
reset();
})();
</script>
</body>
</html>
